name: Auditar cenarios XP Pulse
on:
  push:
    branches: [audit/xp-pulse-scenarios-20261116]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auditar series e cenarios
        run: node scripts/audit-pulse.mjs
